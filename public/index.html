    <script>
      // paint the right colour before React mounts (dark for the hero pages, cream for Kontakt/Rezerwacje) and start loading the hero photo early
      (function () {
        var cream = /^\/(?:[a-z]{2}\/)?(Kontakt|Rezerwacje)(?:\/|$)/i.test(location.pathname);
        document.documentElement.style.backgroundColor = cream ? '#faf8f3' : '#0b1118';
        if (!cream) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = '/img/house.webp';
          document.head.appendChild(l);
        }
      })();
    </script>
